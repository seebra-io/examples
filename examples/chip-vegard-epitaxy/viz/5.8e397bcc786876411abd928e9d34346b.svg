.32em" transform="translate(48,20)">AlN</text><text y="0.32em" transform="translate(108.43143242029637,245.53539019963702)">GaN</text><text y="0.32em" transform="translate(321.406196677144,449.7398669086509)">InN</text><text y="0.32em" transform="translate(494.4560395150425,365.58681185722924)">Si</text><text y="0.32em" transform="translate(508.2246969016615,241.7634603750756)">GaP</text><text y="0.32em" transform="translate(510.3171980242479,238.2516636418633)">AlP</text><text y="0.32em" transform="translate(605.7352492141895,254.90018148820332)">AlAs</text><text y="0.32em" transform="translate(610.8828019757518,423.7265577737447)">GaAs</text><text y="0.32em" transform="translate(613.1008531656936,450)">Ge</text><text y="0.32em" transform="translate(696.9682981589582,387.56805807622504)">InP</text><text y="0.32em" transform="translate(793.3488998652894,450)">InAs</text><text y="0.32em" transform="translate(806.0294566681633,450)">GaSb</text><text y="0.32em" transform="translate(815.2364616075434,290.5384150030248)">AlSb</text><text y="0.32em" transform="translate(980,450)">InSb</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Every epitaxial stack is a vertical line on this map: films must share the substrate&#39;s lattice constant. GaAs and AlAs sit on almost the same line, so (Al,Ga)As layers of any</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">composition grow on GaAs without strain (lasers, HEMTs). InP&#39;s line crosses the (In,Ga)As series at x = 0.4718 with these PBE values (0.53 with measured ones): In0.53Ga0.47As,</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the photodetector of fibre optics. Caveat: PBE gaps are too small (GaAs, InAs, InSb, GaSb come out near zero) and its lattice constants about 1–2% too large; the shape of the map</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">is right, its numbers are not.</text></svg>