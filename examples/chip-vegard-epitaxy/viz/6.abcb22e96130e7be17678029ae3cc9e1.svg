ui-sans-serif, system-ui, sans-serif" font-size="12px">(Al,Ga)As: the gap bends away from the straight line, fitted as −b·x(1−x) with b = -0.185 eV (dashed), while the lattice constant does not bend (Vegard). Caveats: ordered cells fold</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the X and L valleys onto Γ, so their gaps all look direct even where the random alloy is indirect (x above about 0.45); PBE gaps are too small; real alloys are random, not ordered.</text></svg>