, 11)"/><circle cx="673.372" cy="222.94999999999996" r="5" fill="rgb(245, 158, 11)"/><circle cx="478.5839999999999" cy="335.67499999999995" r="5" fill="rgb(245, 158, 11)"/><circle cx="707.8559999999998" cy="218.90000000000003" r="5" fill="rgb(245, 158, 11)"/><circle cx="503.28199999999987" cy="331.4" r="5" fill="rgb(245, 158, 11)"/><circle cx="734.4180000000001" cy="204.27500000000003" r="5" fill="rgb(245, 158, 11)"/><circle cx="356.9580000000001" cy="362.09022562458205" r="5" fill="rgb(29, 78, 216)"/><circle cx="392.3739999999999" cy="344.2249999999999" r="5" fill="rgb(29, 78, 216)"/></g><g aria-label="text" text-anchor="start" font-size="9px" transform="translate(7.5,0.5)"><text y="0.32em" transform="translate(354.62799999999993,358.62499999999994)">TV51R</text><text y="0.32em" transform="translate(408.21799999999996,368.74999999999994)">HO54K</text><text y="0.32em" transform="translate(378.8599999999999,350.3)">NI63_</text><text y="0.32em" transform="translate(294.98,388.54999999999995)">ND61R</text><text y="0.32em" transform="translate(697.6039999999999,202.92499999999998)">MHJ45</text><text y="0.32em" transform="translate(519.5919999999999,290)">BVJ03</text><text y="0.32em" transform="translate(286.12600000000003,487.55)">SAA0K</text><text y="0.32em" transform="translate(615.122,269.75)">EB040</text><text y="0.32em" transform="translate(614.19,245.00000000000006)">RM041</text><text y="0.32em" transform="translate(642.1499999999999,239.37500000000009)">RO041</text><text y="0.32em" transform="translate(636.5579999999999,238.02500000000003)">GM037</text><text y="0.32em" transform="translate(641.6839999999999,231.04999999999998)">JR055</text><text y="0.32em" transform="translate(648.674,226.32500000000002)">PQ052</text><text y="0.32em" transform="translate(673.372,222.94999999999996)">SO148</text><text y="0.32em" transform="translate(478.5839999999999,335.67499999999995)">HE13N</text><text y="0.32em" transform="translate(707.8559999999998,218.90000000000003)">AT138</text><text y="0.32em" transform="translate(503.28199999999987,331.4)">GR13L</text><text y="0.32em" transform="translate(734.4180000000001,204.27500000000003)">NI135</text><text y="0.32em" transform="translate(356.9580000000001,362.09022562458205)">PE43K</text><text y="0.32em" transform="translate(392.3739999999999,344.2249999999999)">DW41K</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">The ionosonde&#39;s M(3000)F2 factor is read from the full ionogram; the mirror model only knows the peak height. Both say the same thing: a 3000 km hop returns about 3 to 4</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">times foF2, and a lower layer (smaller hmF2) gives a larger factor, because the ray meets it at a flatter angle. Points off the diagonal show what the mirror model misses: real rays</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">bend gradually below the peak, so the true reflection is lower than hmF2.</text></svg>