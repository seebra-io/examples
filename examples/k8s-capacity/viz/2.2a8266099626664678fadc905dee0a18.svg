ext></g><g aria-label="rule" stroke="rgb(239, 68, 68)" stroke-dasharray="4px, 3px" transform="translate(0.5,0)"><line x1="940.4761904761904" x2="940.4761904761904" y1="20" y2="130"/></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Requests, not usage: the scheduler places a pod on a node only if the node&#39;s free (allocatable minus requested) CPU and memory both cover the pod&#39;s requests. Allocatable is</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">capacity minus what the system reserves. A NotReady node still shows its pods here.</text></svg>