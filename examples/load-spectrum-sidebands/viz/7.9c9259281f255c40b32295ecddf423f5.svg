nd 21 h), then 5/7 and 9/7. No machine and no person runs on a 21-hour cycle: these lines are not in the</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">world, they are the weekday/weekend change of the daily cycle, seen in frequency. The rectangular window&#39;s side lobes between the lines, and the single week&#39;s broad hump that</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">cannot tell 6/7 from 1, show why spectral analysts choose the record length and the window first.</text></svg>