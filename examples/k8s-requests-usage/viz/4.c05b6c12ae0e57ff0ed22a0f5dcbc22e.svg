<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="466.0" viewBox="0 0 1000 220" stroke="none" font-weight="400" x="0.0" y="0.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="x-axis label" text-anchor="end" transform="translate(37.5,27.5)"><text transform="translate(960,153)">usage / request (log) →</text></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Namespaces by idle requests (requested minus used), most first. Left of the dotted line a container asks for 4× what it uses; right of the red one it uses more than it asked for. Not</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">in the ratio: 0 containers without a CPU request and 0 without a memory request (BestEffort for that resource: the scheduler doesn&#39;t reserve anything for them).</text></svg>