92,162.332L370.615,147.407L388.538,132.481L406.462,117.555L424.385,102.629L442.308,87.703L460.231,72.778L478.154,57.852L496.077,42.926L514,28L531.923,13.074L549.846,-1.851L567.769,-16.777L585.692,-31.703L603.615,-46.629L621.538,-61.555L639.462,-76.481L657.385,-91.406L675.308,-106.332L693.231,-121.258L711.154,-136.184L729.077,-151.11L747,-166.035L764.923,-180.961L782.846,-195.887L800.769,-210.813L818.692,-225.739L836.615,-240.665L854.538,-255.59L872.462,-270.516L890.385,-285.442L908.308,-300.368L926.231,-315.294L944.154,-330.219L962.077,-345.145L980,-360.071"/></g><g aria-label="line" fill="none" stroke="rgb(249, 115, 22)" stroke-width="2.5px" stroke-linejoin="round" stroke-linecap="round" transform="translate(0.5,0.5)"><path d="M83.846,386.22L101.769,371.294L119.692,356.368L137.615,341.442L155.538,326.516L173.462,311.591L191.385,296.665L209.308,281.739L227.231,266.813L245.154,251.887L263.077,236.962L281,222.036L298.923,207.11L316.846,192.184L334.769,177.258L352.692,162.332"/></g><g aria-label="rule" stroke="rgb(244, 244, 245)" stroke-opacity="0.4" stroke-dasharray="2px, 3px" transform="translate(0.5,0)"><line x1="406.4615384615385" x2="406.4615384615385" y1="20" y2="430"/></g><g aria-label="text" text-anchor="start" font-size="10px" transform="translate(4.5,0.5)"><text y="0.32em" transform="translate(406.4615384615385,31.29169360420103)">50-year design life (pre-1990s AASHTO practice)</text></g><g aria-label="dot" fill="rgb(220, 38, 38)" fill-opacity="0.75" stroke="rgb(255, 255, 255)" stroke-width="1.5px" transform="translate(0.5,0.5)"></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Each dot is a 5-year cohort, sized by its bridges; click one for its poor bridges, record by record, on the FHWA/BTS server. Up to about 45 years the poor share grows exponentially</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">(orange: ln share = -6.906 + 0.0964·age, r² = 0.9837): it doubles every 7.2 years. Then it bends: from 45 to 75 years it only goes from about 7% to 11%, the age at which</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">rehabilitation and replacement hold it down, and climbs again past 95 as the oldest bridges outrun them. Dashed: the wear-in law extrapolated; at 50 years it predicts 12.4%</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">poor, against about 7% observed: the gap is the work done on bridges in their fifth and sixth decades.</text></svg>