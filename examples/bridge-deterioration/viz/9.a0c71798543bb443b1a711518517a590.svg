0" r="3" fill="rgb(37, 99, 235)"/><circle cx="980" cy="326.0012714558169" r="3" fill="rgb(161, 161, 170)"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Reconstruction (NBI item 106) resets the clock only partly: a bridge rebuilt within the last 10 years averages about 6.45, a never-reconstructed one of 0–9 years 7.6. Reconstructed</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">bridges then age along the orange curve, about a point below new ones at the same years since work; by age since first built (grey) they rate above never-reconstructed bridges</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">of the same age from about 30 years on (rebuilding is what keeps old bridges in service). Caveat: item 106 is the latest reconstruction only, and what counts as reconstruction</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">varies by state.</text></svg>