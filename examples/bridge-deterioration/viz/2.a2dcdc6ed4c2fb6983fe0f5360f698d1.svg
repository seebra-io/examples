<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="0.0" y="34.1" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18px" font-weight="700">Bridges standing in 2025, by year built (red: poor today)</text><text x="0.0" y="88.0" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18px" font-weight="700">Poor bridges per cohort: 41319 today → 55963 in 2035 → 72684 in 2045</text><svg width="15.0" height="15.0" fill="rgb(220, 38, 38)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="0.0" y="118.8" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="20.0" y="130.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">2025 (inventory)</text><svg width="15.0" height="15.0" fill="rgb(249, 115, 22)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="106.0" y="118.8" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="126.0" y="130.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">2035 (10 years older)</text><svg width="15.0" height="15.0" fill="rgb(250, 204, 21)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="234.0" y="118.8" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="254.0" y="130.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">2045 (20 years older)</text><text x="0.0" y="161.3" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">If each age keeps the poor share it has in the 2025 inventory (today&#39;s mix of wear, repair and replacement), ageing alone takes the poor count from 41319 (6.6% of today&#39;s</text><text x="0.0" y="178.3" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">bridges) to 55963 (9.0%) in 2035 and 72684 (11.7%) in 2045: about 1464 more bridges a year would have to leave the poor class than today just to stand still. The big 1956–1980</text><text x="0.0" y="195.3" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">cohorts (a third of all bridges) are moving into the ages where about one bridge in ten is poor. Click a grey bar for the cohort&#39;s poor bridges on the FHWA/BTS server. Caveat: a</text><text x="0.0" y="212.3" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">period projection (like a life table), not a forecast; new bridges and policy changes are left out.</text></svg>