="38.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="x-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0.5,0)"><line x1="640" x2="640" y1="20" y2="150"/></g><g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><path transform="translate(640,150)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(640,150)">0</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,150)">restarts →</text></g><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><line x1="640" x2="640" y1="20" y2="150"/></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Click a bar for Kubernetes&#39; page on that exit reason. Exit 137 with OOMKilled means the container went over its memory limit: compare its usage with its request in the requests-vs-usage</text><text x="52.9" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">example. Restart counts reset when a pod is recreated, so a rolled-out deployment looks healthier than it was.</text></svg>