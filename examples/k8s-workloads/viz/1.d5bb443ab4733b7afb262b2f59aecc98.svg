<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg width="15.0" height="15.0" fill="rgb(34, 197, 94)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="0.0" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="20.0" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Running</text><svg width="15.0" height="15.0" fill="rgb(234, 179, 8)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="69.7" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="89.7" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Pending</text><svg width="15.0" height="15.0" fill="rgb(148, 163, 184)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="138.6" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="158.6" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Succeeded</text><svg width="15.0" height="15.0" fill="rgb(239, 68, 68)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="219.1" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="239.1" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Failed</text><svg width="15.0" height="15.0" fill="rgb(168, 85, 247)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="276.9" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="296.9" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Unknown</text><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="428.0" viewBox="0 0 1000 160" stroke="none" font-weight="400" x="0.0" y="38.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="x-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0.5,0)"><line x1="560" x2="560" y1="20" y2="130"/></g><g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><path transform="translate(560,130)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(560,130)">0</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,130)">pods →</text></g><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><line x1="560" x2="560" y1="20" y2="130"/></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Running is not ready: a Running pod can have containers waiting in CrashLoopBackOff (see the waiting containers). Failed pods stay until someone deletes them (the Kubernetes</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">operations example evicts them). The API answers up to limit=500 pods; for a bigger cluster read one namespace (path /api/v1/namespaces/&lt;ns&gt;/pods) or raise the limit.</text></svg>