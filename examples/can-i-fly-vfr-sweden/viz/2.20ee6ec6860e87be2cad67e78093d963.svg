<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="18.0" y="26.2" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="18px" font-weight="600">VFR ? → ? looks possible at ?: every TAF group and the model meet the VMC minima</text><text x="18.0" y="56.5" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">ETD ? · ? NM at ? kt (no wind) · ETA ? · minima: ceiling ≥ 1500 ft and visibility ≥ 5 km (SERA VMC in a control zone; special VFR 600 ft, 1500 m)</text><text x="40.0" y="91.3" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">No hour in the TAFs&#39; validity where every group meets the minima.</text><text x="40.0" y="110.2" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">The prevailing forecasts stay VMC as far as they go (?).</text><text x="18.0" y="133.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">SIGMETs: 0 on the route, 1 near Sweden (ULLL), 140 worldwide. AIRMETs are not in the feed (Europe issues them per FIR; ask your briefing service).</text><text x="29.0" y="166.9" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">Not an official pre-flight briefing.</text><text x="244.1" y="166.9" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">Use</text><text x="273.9" y="166.9" fill="rgb(0, 0, 238)" font-family="system-ui, sans-serif" font-size="13px">AROWeb</text><text x="330.9" y="166.9" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">or your briefing service: NOTAMs, winds and temperatures aloft, icing, airspace and terrain are not here.</text><text x="29.0" y="185.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">The flight category (VFR/MVFR/IFR/LIFR) is the US convention; the go/no-go uses the SERA minima. Ages are on your clock: newest METAR ?; 0 METARs, 36</text><text x="29.0" y="204.6" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">TAFs in the box.</text><text x="29.0" y="223.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">METAR/TAF/SIGMET:</text><text x="155.9" y="223.4" fill="rgb(0, 0, 238)" font-family="system-ui, sans-serif" font-size="13px">NOAA Aviation Weather Center</text><text x="344.8" y="223.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">(public domain). Forecast:</text><text x="508.3" y="223.4" fill="rgb(0, 0, 238)" font-family="system-ui, sans-serif" font-size="13px">SMHI</text><text x="541.2" y="223.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">(CC BY 4.0). Next: change the ETD or the airports in the</text><text x="880.6" y="223.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px" font-style="italic">route</text><text x="914.6" y="223.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">step; the</text><text x="29.0" y="242.2" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="13px">timeline shows when each group bites.</text></svg>