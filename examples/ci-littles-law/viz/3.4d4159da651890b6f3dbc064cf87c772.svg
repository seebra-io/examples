5874403,400.00623830318153)">20</text><text y="0.32em" transform="translate(327.85194427115823,371.55957579538364)">21</text><text y="0.32em" transform="translate(878.2532751091704,41.4285714285714)">22</text><text y="0.32em" transform="translate(393.7450613433146,310.9232688708671)">23</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">On the dashed line the law holds hour by hour. It doesn&#39;t need to: an hour is not much longer than a 30-minute run, so a burst of arrivals counts fully in its own λW but spreads</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">its load into the next hours (below the line in the burst hour, above it after). Little&#39;s law is exact over a window when the system is empty at both ends, and approximate over any</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">window much longer than W.</text></svg>