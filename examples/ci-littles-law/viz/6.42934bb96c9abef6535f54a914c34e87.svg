/text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">builders and test matrices stay 15–30 minutes. Re-runs and runs whose last update came over 6 hours after their start are left out (the clean step&#39;s suspect flag).</text></svg>