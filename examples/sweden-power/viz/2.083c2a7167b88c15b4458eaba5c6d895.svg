y="1" transform="translate(0.5,0)"><line stroke="rgb(244, 244, 245)" y2="6" y1="-10"/><text fill="rgb(244, 244, 245)" y="9" dy="0.71em">0</text></g><g opacity="1" transform="translate(96.5,0)"><line stroke="rgb(244, 244, 245)" y2="6" y1="-10"/><text fill="rgb(244, 244, 245)" y="9" dy="0.71em">5</text></g><g opacity="1" transform="translate(192.5,0)"><line stroke="rgb(244, 244, 245)" y2="6" y1="-10"/><text fill="rgb(244, 244, 245)" y="9" dy="0.71em">10</text></g></g><text x="0" y="12" fill="rgb(244, 244, 245)" font-weight="700">hour of the day</text></svg><text x="0.0" y="121.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Notice: hydro and solar move together most (r +0.88); colour shows both may simply follow the clock, as demand and weather change through the day: a correlation is not a</text><text x="0.0" y="138.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">cause. Caveat: one day of quarter hours, each close to the last, is far less evidence than the number of points suggests.</text></svg>