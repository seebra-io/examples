<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg font-family="system-ui, sans-serif" font-size="10px" width="240.0" height="50.0" viewBox="0 0 240 50" fill="rgb(0, 0, 0)" stroke="none" font-weight="400" x="0.0" y="0.0" overflow="visible" color="rgb(244, 244, 245)"><image x="0" y="18" width="240" height="10" preserveAspectRatio="none" href="data:image/png;base64,"/><g transform="translate(0,28)" fill="none" text-anchor="middle" font-variant="tabular-nums"/></svg><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="399.0" viewBox="0 0 1000 460" stroke="none" font-weight="400" x="0.0" y="50.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="fy-axis tick label" transform="translate(9.5,0.5)"><g text-anchor="start" transform="translate(0,1)"><text y="0.32em" transform="translate(960,120)">MLE exponent α (±1.96 se)</text></g><g text-anchor="start" transform="translate(0,214)"><text y="0.32em" transform="translate(960,120)">KS distance (and the 1/√n noise level)</text></g></g><g aria-label="x-axis label" text-anchor="end" transform="translate(37.5,27.5)"><text transform="translate(960,430)">x_min: smallest number of students counted as tail →</text></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">For a true power law, α would level off once x_min passes the start of the tail. Here it climbs steadily, from undefined at x_min = 1 to undefined at undefined: the log-log curve</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">bends downward everywhere. The KS distance is smallest at x_min = undefined (orange; undefined advisors, KS = undefined against a noise level of undefined), so even the best</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">tail fit is only marginally consistent with a power law. Hover a point for its tail size. Next: compare with a lognormal or a power law with exponential cutoff (not computed here).</text></svg>