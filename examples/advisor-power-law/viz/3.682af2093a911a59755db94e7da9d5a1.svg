732932872,430)" d="M0,0L0,6"/><path transform="translate(889.6798678764912,430)" d="M0,0L0,6"/><path transform="translate(937.3540187974507,430)" d="M0,0L0,6"/><path transform="translate(980,430)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(48,430)">1</text><text y="0.71em" transform="translate(328.5599559588304,430)">2</text><text y="0.71em" transform="translate(492.67700939872526,430)">3</text><text y="0.71em" transform="translate(609.1199119176608,430)">4</text><text y="0.71em" transform="translate(699.4400440411695,430)">5</text><text y="0.71em" transform="translate(773.2369653575557,430)">6</text><text y="0.71em" transform="translate(835.6313732932872,430)">7</text><text y="0.71em" transform="translate(889.6798678764912,430)">8</text><text y="0.71em" transform="translate(937.3540187974507,430)">9</text><text y="0.71em" transform="translate(980,430)">10</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">k: doctoral students per advisor, or advisors per student (log scale) →</text></g></svg><text x="0.0" y="428.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Each dot: the share of advisors (blue) with at least k doctoral students in Wikidata, or of students (orange) with at least k advisors; click a dot for the people at that k in the</text><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Wikidata Query Service. Notice that the blue curve falls slowly over two decades of k while the orange one plunges like its geometric reference (dotted): a geometric with the</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">advisors&#39; own mean would expect essentially nobody with 50 students, yet hundreds have. The two power-law lines differ (α = undefined from k ≥ 1, α = undefined from k ≥</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">undefined): the curve bends, so &quot;the&quot; exponent depends on where the tail is said to start (next chart). Caveat: these are the supervisions Wikidata records (P184), not all that</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">happened.</text></svg>