<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg width="15.0" height="15.0" fill="rgb(22, 163, 74)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="0.0" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="20.0" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Cheshire (underfloor + radiators)</text><svg width="15.0" height="15.0" fill="rgb(37, 99, 235)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="183.8" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="203.8" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Angus (radiators)</text><svg width="15.0" height="15.0" fill="rgb(245, 158, 11)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="294.5" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="314.5" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">Newcastle (radiators)</text><svg width="15.0" height="15.0" fill="rgb(220, 38, 38)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="423.5" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="443.5" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">London (radiators)</text><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="411.0" viewBox="0 0 1000 500" stroke="none" font-weight="400" x="0.0" y="38.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="y-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0,0.5)"><line x1="48" x2="980" y1="470" y2="470"/><line x1="48" x2="980" y1="432.5" y2="432.5"/><line x1="48" x2="980" y1="395" y2="395"/><line x1="48" x2="980" y1="357.5" y2="357.5"/><line x1="48" x2="980" y1="320.00000000000006" y2="320.00000000000006"/><line x1="48" x2="980" y1="282.49999999999994" y2="282.49999999999994"/><line x1="48" x2="980" y1="245" y2="245"/><line x1="48" x2="980" y1="207.49999999999997" y2="207.49999999999997"/><line x1="48" x2="980" y1="170.00000000000003" y2="170.00000000000003"/><line x1="48" x2="980" y1="132.5" y2="132.5"/><line x1="48" x2="980" y1="94.99999999999999" y2="94.99999999999999"/><line x1="48" x2="980" y1="57.500000000000014" y2="57.500000000000014"/><line x1="48" x2="980" y1="20" y2="20"/></g><g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0,0.5)"><path transform="translate(48,470)" d="M0,0L-6,0"/><path transform="translate(48,432.5)" d="M0,0L-6,0"/><path transform="translate(48,395)" d="M0,0L-6,0"/><path transform="translate(48,357.5)" d="M0,0L-6,0"/><path transform="translate(48,320.00000000000006)" d="M0,0L-6,0"/><path transform="translate(48,282.49999999999994)" d="M0,0L-6,0"/><path transform="translate(48,245)" d="M0,0L-6,0"/><path transform="translate(48,207.49999999999997)" d="M0,0L-6,0"/><path transform="translate(48,170.00000000000003)" d="M0,0L-6,0"/><path transform="translate(48,132.5)" d="M0,0L-6,0"/><path transform="translate(48,94.99999999999999)" d="M0,0L-6,0"/><path transform="translate(48,57.500000000000014)" d="M0,0L-6,0"/><path transform="translate(48,20)" d="M0,0L-6,0"/></g><g aria-label="y-axis tick label" text-anchor="end" font-variant="tabular-nums" transform="translate(-8.5,0.5)"><text y="0.32em" transform="translate(48,470)">0</text><text y="0.32em" transform="translate(48,432.5)">1</text><text y="0.32em" transform="translate(48,395)">2</text><text y="0.32em" transform="translate(48,357.5)">3</text><text y="0.32em" transform="translate(48,320.00000000000006)">4</text><text y="0.32em" transform="translate(48,282.49999999999994)">5</text><text y="0.32em" transform="translate(48,245)">6</text><text y="0.32em" transform="translate(48,207.49999999999997)">7</text><text y="0.32em" transform="translate(48,170.00000000000003)">8</text><text y="0.32em" transform="translate(48,132.5)">9</text><text y="0.32em" transform="translate(48,94.99999999999999)">10</text><text y="0.32em" transform="translate(48,57.500000000000014)">11</text><text y="0.32em" transform="translate(48,20)">12</text></g><g aria-label="y-axis label" text-anchor="start" transform="translate(-44.5,-16.5)"><text y="0.71em" transform="translate(48,20)">↑ COP (heat out / electricity in)</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,470)">daily mean outdoor temperature (°C) →</text></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">The same heat pump model in four houses. Solid: measured COP per 2 K band; dashed: the Carnot limit for the same flow and outdoor temperatures (cut at 12). Each house&#39;s</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">COP falls as it gets colder, but the gap between the houses is larger than the effect of the weather: the house with underfloor heating (green) runs its water about 9 K cooler than</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">London (red) and gets about 1.45 times the heat per kWh. Click a dot to open the system on heatpumpmonitor.org.</text></svg>