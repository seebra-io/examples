58064516128" y1="20" y2="470"/><line x1="799.6129032258063" x2="799.6129032258063" y1="20" y2="470"/></g><g aria-label="rule" stroke="rgb(161, 161, 170)" stroke-dasharray="2px, 3px" transform="translate(0.5,0)"><line x1="438.8387096774194" x2="438.8387096774194" y1="20" y2="470"/><line x1="559.0967741935483" x2="559.0967741935483" y1="20" y2="470"/></g><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0,0.5)"><line x1="48" x2="980" y1="470" y2="470"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Most seconds lie within ±50 mHz (orange), the standard frequency range; inside ±10 mHz (grey) primary control may stay idle. A deviation of 50 mHz means about 750 MW of</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">primary control power at work across Continental Europe (3000 MW per 200 mHz): the controller trades a small, permanent frequency error for stability, as every proportional</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">controller does.</text></svg>