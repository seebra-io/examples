 transform="translate(541.4117647058824,450)">1.8</text><text y="0.71em" transform="translate(596.2352941176471,450)">2.0</text><text y="0.71em" transform="translate(651.0588235294117,450)">2.2</text><text y="0.71em" transform="translate(705.8823529411766,450)">2.4</text><text y="0.71em" transform="translate(760.7058823529412,450)">2.6</text><text y="0.71em" transform="translate(815.5294117647059,450)">2.8</text><text y="0.71em" transform="translate(870.3529411764705,450)">3.0</text><text y="0.71em" transform="translate(925.1764705882355,450)">3.2</text><text y="0.71em" transform="translate(980,450)">3.4</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,450)">Δχ: Pauling electronegativity difference →</text></g><g aria-label="line" fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5px, 3px" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Dashed: Fisher&#39;s linear discriminant between tetrahedral and octahedral ground states (n̄ = undefined + undefined·Δχ); red: the best single threshold, Δχ = null. Tetrahedral</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">(zincblende, wurtzite) compounds sit at small electronegativity difference and small, light atoms: covalent sp³ bonds that point to four neighbours. Ionic ones (large Δχ) prefer six</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">neighbours, the rock salt of NaCl and MgO; heavy atoms (large n̄) tip the balance early. Every semiconductor of electronics lives in the tetrahedral corner. Caveats: Pauling χ is a</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">crude ionicity (Phillips&#39; spectroscopic ionicity, with its critical value 0.785, separates them perfectly); ground states are PBE at 0 K; &#39;other&#39; are distorted or layered structures.</text></svg>