s turned round: the short-period shaking has been absorbed on the way, the long periods have not, and tall buildings now feel the most relative to the ground. This is</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">why the 1985 Michoacán quake destroyed 10–20 storey buildings in Mexico City, 350 km away. Hover for the numbers.</text></svg>