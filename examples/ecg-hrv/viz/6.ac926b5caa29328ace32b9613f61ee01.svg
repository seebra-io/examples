family="ui-sans-serif, system-ui, sans-serif" font-size="12px">ventricular beat doesn&#39;t reach the sinus node, so the next sinus beat comes on its own schedule. Dots on the line are why one PVC adds two wild RR intervals but no net time: the</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">sinus rhythm underneath keeps ticking. Hover for each beat&#39;s timing; click for the record&#39;s notes.</text></svg>