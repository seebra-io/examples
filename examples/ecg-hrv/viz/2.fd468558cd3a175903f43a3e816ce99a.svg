"none" text-anchor="start" transform="translate(1,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(322,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(643,0)"/></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Pale red: computed from every consecutive pair of beats; blue: from normal-to-normal intervals only (the standard). For the healthy record the two agree. For 119 the premature</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">beats inflate RMSSD and pNN50 many times over (hover the bars): a naive HRV monitor would call this heart superbly vagal when it is in bigeminy. Caveat: 15-minute windows</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">(SDNN grows with window length: compare only like with like), annotations by cardiologists, not a beat detector.</text></svg>