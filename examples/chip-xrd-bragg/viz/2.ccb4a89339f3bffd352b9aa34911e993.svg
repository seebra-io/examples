rgb(255, 114, 92)"/><circle cx="472.37802350690583" cy="164.22947999232173" r="4" fill="rgb(255, 114, 92)"/><circle cx="544.6474978623498" cy="153.3453415443313" r="4" fill="rgb(255, 114, 92)"/><circle cx="589.1127085114709" cy="146.5796965906074" r="4" fill="rgb(255, 114, 92)"/><circle cx="604.2676193098652" cy="144.23712477888" r="4" fill="rgb(255, 114, 92)"/><circle cx="604.2676193098652" cy="144.23712477888" r="4" fill="rgb(255, 114, 92)"/><circle cx="667.4063274445299" cy="134.23357806224982" r="4" fill="rgb(255, 114, 92)"/><circle cx="718.7263662845467" cy="125.6719472296599" r="4" fill="rgb(255, 114, 92)"/><circle cx="736.9541310995494" cy="122.49899671823644" r="4" fill="rgb(255, 114, 92)"/><circle cx="818.921667801916" cy="107.1850198062788" r="4" fill="rgb(255, 114, 92)"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Dots: exact splitting from Bragg&#39;s law; dashed: the small-mismatch formula Δ2θ = −2 tan θ · Δa/a. AlAs on GaAs (−0.13% mismatch) splits by under 0.05° at (111) but several times</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">more at high angles: that is why the mismatch, strain and composition of epitaxial films are measured on high-angle reflections like (004). Ge on Si (4%) is far too mismatched to</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">grow thick without dislocations.</text></svg>