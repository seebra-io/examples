is label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">neutrons N →</text></g><g aria-label="line" fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3px, 3px" transform="translate(0.5,0.5)"><path d="M48,430L980,20" data-tip="0, 1"/></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">The black valley of stability bends below N = Z (dashed) as nuclei grow: protons repel, so heavy nuclei need extra neutrons. Too many neutrons: β− (blue); too few: β+ or capture</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">(pink). Past lead (Z = 82) the yellow α emitters take over: shedding a helium nucleus releases energy, and how fast depends on tunnelling (next chart). Hover a cell; click for its</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">IAEA data.</text></svg>