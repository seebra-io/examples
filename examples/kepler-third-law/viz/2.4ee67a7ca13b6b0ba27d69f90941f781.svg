ms" transform="translate(491,0)"><text y="0.71em" transform="translate(98.78782945155965,430)">−5</text><text y="0.71em" transform="translate(213.3932020962791,430)">0</text><text y="0.71em" transform="translate(327.9985747409986,430)">5</text><text y="0.71em" transform="translate(442.6039473857181,430)">10</text></g></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">log₁₀ a (AU), or log₁₀ a³/M★ (AU³/M☉) →</text></g><g aria-label="line" transform="translate(0.5,0.5)"><g fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(1,0)"><path d="M159.379,352.563L302.222,155.907" data-tip="0, 1"/></g><g fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(491,0)"><path d="M48,430L489,25.243" data-tip="2, 3"/></g></g><g aria-label="dot" transform="translate(0.5,0.5)"><g fill-opacity="0.75" transform="translate(1,0)"></g><g fill-opacity="0.75" transform="translate(491,0)"></g></g><g aria-label="tip" transform="translate(0.5,0.5)"><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(1,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(491,0)"/></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Left: period against orbit size for planets around stars of every mass; the colours fan out, because a heavier star swings its planets round faster. Right: divide a³ by the star&#39;s mass</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">and every planet, from 0.2-day lava worlds to century-long orbits, lands on one line, P² = a³/M★ (dashed). Hover a planet; click it for its system in the NASA Exoplanet Archive.</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Caveat: for most transiting planets the archive computed a from P and M★ with this law, so the right panel is partly the law checking itself (see the next chart).</text></svg>