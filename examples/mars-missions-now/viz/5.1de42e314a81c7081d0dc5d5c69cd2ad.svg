1" r="14"/><circle cx="362.5218644697504" cy="192" r="14"/><circle cx="654.7847088145674" cy="223" r="14"/><circle cx="835.0364704908518" cy="254" r="14"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Odyssey, MRO and TGO fly low and nearly circular, for sharp, close-up maps. Mars Express and Tianwen-1 dip as low but swing out past Phobos; Hope never comes closer than</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">20,000 km, so it sees the whole disk and its weather at once. Grey: ended. Dashed: the orbits of Phobos (about 6,000 km up) and Deimos (about 20,000 km).</text></svg>