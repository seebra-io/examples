<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="14.0" y="27.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="17px" font-weight="700">Missions at Mars now: 8 spacecraft at work</text><text x="14.0" y="55.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">2 on the ground and 6 in orbit, from 4 space agencies, as of 2026-11-18. Below: how long each has been there, where</text><text x="14.0" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">the surface missions are, how high the orbiters fly, and a table with what each one carries and a source for its status.</text><text x="14.0" y="105.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Look for:</text><text x="79.6" y="105.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">the fleet is old. Mars Odyssey has orbited since 2001 and Mars Express since 2003, and most of what the</text><text x="14.0" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">rovers send home is relayed by orbiters built for other jobs. The fleet shrinks too: MAVEN went silent in December</text><text x="14.0" y="147.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">2025, and Odyssey is nearly out of fuel. Two new missions, ESCAPADE and MMX, are on their way for 2027.</text><text x="14.0" y="176.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Go further:</text><text x="91.3" y="176.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">how they got there in</text><text x="238.9" y="176.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Landing on Mars</text><text x="344.2" y="176.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">; what the rovers carry,
part by part, in</text><text x="598.6" y="176.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Mars rovers up close</text><text x="726.0" y="176.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">; their</text><text x="14.0" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">newest photos in</text><text x="130.1" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Mars rovers: the latest raw images</text><text x="343.2" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">;
who is going next in</text><text x="486.2" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">The road to Mars</text><text x="592.3" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">.</text><text x="14.0" y="226.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Mind: &quot;working&quot; is the last status a source states (see status_as_of in the table); a spacecraft can fall silent between</text><text x="14.0" y="247.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">updates. Orbits are the science orbits&#39; altitudes above the surface, rounded; they change as missions adjust them.</text></svg>