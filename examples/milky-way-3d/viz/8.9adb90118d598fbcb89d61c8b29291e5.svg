late(853.7500085262092,460)">4.5</text><text y="0.71em" transform="translate(936.218801988926,460)">5.0</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,37.5)"><text transform="translate(980,460)">colour BP − RP (mag) → redder, cooler</text></g><g aria-label="dot" fill-opacity="0.7" transform="translate(0.5,0.5)"></g><g aria-label="text" fill="rgb(253, 224, 71)" text-anchor="start" transform="translate(8.5,0.5)"><text y="0.32em" transform="translate(246.77968864061324,121.30237038786166)">the Sun would sit here</text></g><g aria-label="dot" fill="none" stroke="rgb(253, 224, 71)" stroke-width="1.5px" transform="translate(0.5,0.5)"><circle cx="246.77968864061324" cy="121.30237038786166" r="4"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">9,652 Gaia DR3 sources within 100 ly (parallax &gt; 32.6 mas, parallax/error &gt; 10), live from ESA&#39;s archive. HYG lists 4,048 stars in the same sphere: most of the difference is faint red</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">dwarfs. Colour classes are a rough guess from BP − RP. The grey band near absolute G 18 is not a sequence of stars: these sources are fainter than G = 19, where Gaia&#39;s BP and RP</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">fluxes are noisy and blended (Riello et al. 2021, A&amp;A 649, A3), so their colours can&#39;t be trusted. The Sun: absolute G ≈ 4.67, BP − RP ≈ 0.82 (Casagrande &amp; VandenBerg 2018).</text></svg>