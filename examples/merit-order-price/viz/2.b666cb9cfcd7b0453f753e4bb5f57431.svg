42.308,347.703L406.462,357.94L370.615,374.122L334.769,378.305L298.923,386.781L263.077,397.899L227.231,400.981L191.385,412.869L155.538,417.493L119.692,418.153L83.846,425.749L48,432.794Z"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0,0.5)"><line x1="48" x2="980" y1="470" y2="470"/></g></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Net imports swing the most: at negative residual load Germany exports 10–15 GW into the coupled European market, at 50 GW it imports 12–14 GW, so neighbours&#39; plants are</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">part of the same merit order. Lignite stays on (1.5–9 GW, must-run and slow), while gas (1.5 → 9 GW) and pumped hydro (0 → 6 GW) rise steeply only at the top: they are the</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">marginal suppliers in the evening, and their costs are the steep end of the price curve. Caveat: public net generation (Energy-Charts); industrial self-supply and the actual bids are</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">not in the data.</text></svg>