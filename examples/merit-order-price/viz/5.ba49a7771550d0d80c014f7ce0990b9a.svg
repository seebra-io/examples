<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg width="15.0" height="15.0" fill="rgb(17, 24, 39)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="0.0" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="20.0" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">load</text><svg width="15.0" height="15.0" fill="rgb(37, 99, 235)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="50.4" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="70.4" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">residual load</text><svg width="15.0" height="15.0" fill="rgb(245, 158, 11)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="140.8" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="160.8" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">solar</text><svg width="15.0" height="15.0" fill="rgb(16, 185, 129)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="194.0" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="214.0" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">wind</text><text x="0.0" y="51.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">The duck: solar digs a trough into the residual load at midday, and the price (solid mean, dashed median) falls into the same trough, often below zero, then climbs to its peak in</text><text x="0.0" y="68.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the evening ramp when the sun sets and demand is still high. Load alone has no such dip.</text></svg>