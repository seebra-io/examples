7155963304" cy="263.4702357445786" r="3.5"/><circle cx="339.3836009174312" cy="255.0869662265415" r="3.5"/><circle cx="372.7838302752294" cy="251.14644322727978" r="3.5"/><circle cx="406.1840596330275" cy="248.05583695334906" r="3.5"/><circle cx="439.58428899082566" cy="242.53137823869787" r="3.5"/><circle cx="472.9845183486239" cy="240.8701773664601" r="3.5"/><circle cx="506.384747706422" cy="237.9341014062259" r="3.5"/><circle cx="539.7849770642201" cy="235.07529060283997" r="3.5"/><circle cx="573.1852064220183" cy="234.30263903435724" r="3.5"/><circle cx="606.5854357798166" cy="232.10058206418162" r="3.5"/><circle cx="639.9856651376147" cy="230.4007486135197" r="3.5"/><circle cx="673.3858944954128" cy="228.89407805497848" r="3.5"/><circle cx="706.7861238532109" cy="226.49885819268218" r="3.5"/><circle cx="740.1863532110092" cy="224.87628989886852" r="3.5"/><circle cx="773.5865825688073" cy="222.0174790954826" r="3.5"/><circle cx="806.9868119266056" cy="218.73370992943123" r="3.5"/><circle cx="840.3870412844036" cy="216.02942943974182" r="3.5"/><circle cx="873.7872706422017" cy="211.5480503425422" r="3.5"/><circle cx="907.1875" cy="188.0208100822445" r="3.5"/><circle cx="940.5877293577981" cy="148.42241719750697" r="3.5"/><circle cx="973.9879587155963" cy="106.50606960732138" r="3.5"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">The price is not set by how much power is used but by what is left once wind and sun have been taken: the residual load picks the last (marginal) plant in the merit order, and that</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">plant&#39;s running cost becomes everyone&#39;s price. Below zero residual load (bright dots: sunny middays) the price sits at or below 0; it climbs steeply as the first plants are needed,</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">flattens from 20 to 35 GW, and turns up again above 35 GW where gas and pumped hydro have to run. Hover a dot for the hour, a blue point for its bin.</text></svg>