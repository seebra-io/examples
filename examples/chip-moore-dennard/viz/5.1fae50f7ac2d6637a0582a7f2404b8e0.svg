abel="rule" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><line x1="100" x2="100" y1="20" y2="450" stroke-opacity="1"/><line x1="980" x2="980" y1="20" y2="450" stroke-opacity="0.3"/></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">0.5 doublings per year is Moore&#39;s &#39;every two years&#39;. Transistors stay near it in both eras; clock and power drop to about zero after the break (the end of Dennard scaling), and</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">cores rise.</text></svg>