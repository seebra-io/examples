0"/></g><g aria-label="y-axis tick label" text-anchor="end" font-variant="tabular-nums" transform="translate(-8.5,0.5)"><text y="0.32em" transform="translate(48,440)">1</text><text y="0.32em" transform="translate(48,313.56740182112793)">2</text><text y="0.32em" transform="translate(48,239.6090730177418)">3</text><text y="0.32em" transform="translate(48,187.13480364225583)">4</text><text y="0.32em" transform="translate(48,146.43259817887213)">5</text><text y="0.32em" transform="translate(48,113.17647483886972)">6</text><text y="0.32em" transform="translate(48,85.05882319401219)">7</text><text y="0.32em" transform="translate(48,60.70220546338376)">8</text><text y="0.32em" transform="translate(48,39.21814603548356)">9</text><text y="0.32em" transform="translate(48,20)">10</text></g><g aria-label="y-axis label" text-anchor="start" transform="translate(-44.5,-16.5)"><text y="0.71em" transform="translate(48,20)">↑ value (log scale; each measure in its own unit: see the legend)</text></g><g aria-label="x-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0.5,0)"><line x1="514" x2="514" y1="20" y2="440"/></g><g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><path transform="translate(514,440)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(514,440)">2005</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,440)">year of introduction →</text></g><g aria-label="rule" stroke="rgb(244, 244, 245)" stroke-opacity="0.6" stroke-dasharray="4px, 3px" transform="translate(0.5,0)"><line x1="514" x2="514" y1="20" y2="440"/></g><g aria-label="text" fill-opacity="0.7" text-anchor="start" transform="translate(4.5,4.5)"><text y="0.71em" transform="translate(514,20)">break: 2005 (best fit for the clock)</text></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Dots: processors (click one for the source). Lines: a constant doubling time fitted before and after 2005. Notice that the transistor line hardly bends at 2005, while clock and power</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">go flat: transistors kept doubling but could no longer be clocked faster without melting the chip, and single-thread performance slowed with the clock; the cores took over.</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Caveat: the points before 2010 were digitised from a published plot (Horowitz et al.), not read from data sheets; &quot;power&quot; is typical TDP.</text></svg>