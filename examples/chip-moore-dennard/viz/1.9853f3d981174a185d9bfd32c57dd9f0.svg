<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg font-family="system-ui, sans-serif" font-size="10px" width="240.0" height="50.0" viewBox="0 0 240 50" fill="rgb(0, 0, 0)" stroke="none" font-weight="400" x="0.0" y="0.0" overflow="visible" color="rgb(244, 244, 245)"><image x="0" y="18" width="240" height="10" preserveAspectRatio="none" href="data:image/png;base64,"/><g transform="translate(0,28)" fill="none" text-anchor="middle" font-variant="tabular-nums"/></svg><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="416.0" viewBox="0 0 1000 480" stroke="none" font-weight="400" x="0.0" y="50.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="y-axis label" text-anchor="start" transform="translate(-44.5,-16.5)"><text y="0.71em" transform="translate(48,20)">↑ sum of squared residuals, log2(MHz)²</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,450)">candidate break year →</text></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Lower is a better fit. The valley says when the clock stopped doubling: the data picks the year, not us. Hover a dot for both slopes. Caveat: the points are not evenly spread in time,</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">and a few late overclocked parts pull the &#39;after&#39; line.</text></svg>