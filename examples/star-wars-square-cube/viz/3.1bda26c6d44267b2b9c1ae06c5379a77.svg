sform="translate(326.1915385348248,251.6831623968275)">Dud Bolt</text><text y="0.32em" transform="translate(721.8304418731842,184.9867827642056)">Owen Lars</text><text y="0.32em" transform="translate(841.7293297069751,165.85073826878852)">Grievous</text><text y="0.32em" transform="translate(794.0405003338271,174.50453804034981)">IG-88</text><text y="0.32em" transform="translate(800.2062125338974,176.4756902648338)">Darth Vader</text><text y="0.32em" transform="translate(891.3277105560109,176.4756902648338)">Tarfful</text><text y="0.32em" transform="translate(107.05885413079153,317.8776948052356)">Yoda</text><text y="0.32em" transform="translate(875.2320273287202,189.67829735199837)">Chewbacca</text><text y="0.32em" transform="translate(877.943843313559,206.07731486198156)">Lama Su</text><text y="0.32em" transform="translate(218.46746866737493,326.3887873046074)">Ratts Tyerel</text><text y="0.32em" transform="translate(745.7317119659513,251.6831623968275)">Padmé Amidala</text><text y="0.32em" transform="translate(771.9641566333072,247.29454358932136)">Wat Tambor</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">If tall characters were humans scaled up, they would follow the steep dashed line: twice as tall, 8 times as heavy. Star Wars bodies follow a slope of 1.543: twice as tall is only 2.9</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">times as heavy, flatter even than the BMI&#39;s slope 2. Tall aliens (Kaminoans, Gungans, Wat Tambor) are designed lanky, and small ones (Yoda, droids) dense: costumes, puppets</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">and CGI, not biology. Hover a character; click for its Wookieepedia page. Data: SWAPI (swapi.info), fans&#39; record of Lucasfilm&#39;s films (Star Wars © Lucasfilm): masses are fan</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">estimates, not measurements.</text></svg>