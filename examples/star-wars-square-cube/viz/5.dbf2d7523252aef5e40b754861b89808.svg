s in the</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">mass chart are not just unusually tall individuals: Jabba is 58% of the Hutt average yet 19× too heavy, Grievous (a cyborg) 27% taller than a Kaleesh. &#39;Human (species not listed)&#39; is</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">SWAPI leaving the field empty: 32 people, nearly all human. Click a species for Wookieepedia.</text></svg>