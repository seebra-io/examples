62.79838827532932)">−1</text><text y="0.32em" transform="translate(48,20)">0</text></g><g aria-label="y-axis label" text-anchor="start" transform="translate(-44.5,-16.5)"><text y="0.71em" transform="translate(48,20)">↑ log₁₀(P / 1 atm), reported vapour pressure</text></g><g aria-label="x-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0.5,0)"><line x1="48" x2="48" y1="20" y2="430"/><line x1="119.89693743732161" x2="119.89693743732161" y1="20" y2="430"/><line x1="191.79387487464322" x2="191.79387487464322" y1="20" y2="430"/><line x1="263.6908123119648" x2="263.6908123119648" y1="20" y2="430"/><line x1="335.58774974928644" x2="335.58774974928644" y1="20" y2="430"/><line x1="407.484687186608" x2="407.484687186608" y1="20" y2="430"/><line x1="479.3816246239296" x2="479.3816246239296" y1="20" y2="430"/><line x1="551.2785620612513" x2="551.2785620612513" y1="20" y2="430"/><line x1="623.1754994985729" x2="623.1754994985729" y1="20" y2="430"/><line x1="695.0724369358945" x2="695.0724369358945" y1="20" y2="430"/><line x1="766.969374373216" x2="766.969374373216" y1="20" y2="430"/><line x1="838.8663118105378" x2="838.8663118105378" y1="20" y2="430"/><line x1="910.7632492478592" x2="910.7632492478592" y1="20" y2="430"/></g><g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><path transform="translate(48,430)" d="M0,0L0,6"/><path transform="translate(119.89693743732161,430)" d="M0,0L0,6"/><path transform="translate(191.79387487464322,430)" d="M0,0L0,6"/><path transform="translate(263.6908123119648,430)" d="M0,0L0,6"/><path transform="translate(335.58774974928644,430)" d="M0,0L0,6"/><path transform="translate(407.484687186608,430)" d="M0,0L0,6"/><path transform="translate(479.3816246239296,430)" d="M0,0L0,6"/><path transform="translate(551.2785620612513,430)" d="M0,0L0,6"/><path transform="translate(623.1754994985729,430)" d="M0,0L0,6"/><path transform="translate(695.0724369358945,430)" d="M0,0L0,6"/><path transform="translate(766.969374373216,430)" d="M0,0L0,6"/><path transform="translate(838.8663118105378,430)" d="M0,0L0,6"/><path transform="translate(910.7632492478592,430)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(48,430)">0.0</text><text y="0.71em" transform="translate(119.89693743732161,430)">0.1</text><text y="0.71em" transform="translate(191.79387487464322,430)">0.2</text><text y="0.71em" transform="translate(263.6908123119648,430)">0.3</text><text y="0.71em" transform="translate(335.58774974928644,430)">0.4</text><text y="0.71em" transform="translate(407.484687186608,430)">0.5</text><text y="0.71em" transform="translate(479.3816246239296,430)">0.6</text><text y="0.71em" transform="translate(551.2785620612513,430)">0.7</text><text y="0.71em" transform="translate(623.1754994985729,430)">0.8</text><text y="0.71em" transform="translate(695.0724369358945,430)">0.9</text><text y="0.71em" transform="translate(766.969374373216,430)">1.0</text><text y="0.71em" transform="translate(838.8663118105378,430)">1.1</text><text y="0.71em" transform="translate(910.7632492478592,430)">1.2</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">Tb/T − 1 (how far below its normal boiling point the reading was taken) →</text></g><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><line x1="48" x2="48" y1="20" y2="430"/></g><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0,0.5)"><line x1="48" x2="980" y1="20" y2="20"/></g><g aria-label="line" fill="none" stroke="rgb(249, 115, 22)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" transform="translate(0.5,0.5)"><path d="M48,20L980,272.986" data-tip="0, 1"/></g><g aria-label="line" fill="none" stroke="rgb(100, 116, 139)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5px, 3px" transform="translate(0.5,0.5)"><path d="M48,20L980,307.761" data-tip="0, 1"/></g><g aria-label="line" fill="none" stroke="rgb(220, 38, 38)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5px, 3px" transform="translate(0.5,0.5)"><path d="M48,20L980,352.389" data-tip="0, 1"/></g><g aria-label="dot" fill-opacity="0.8" transform="translate(0.5,0.5)"></g><g aria-label="text" text-anchor="end" font-size="10px" transform="translate(0.5,-5.5)"><text y="0.32em" transform="translate(980,272.986475922487)">Trouton: ΔS = 10.5 R = 87.3 J/(mol·K)</text><text y="0.32em" transform="translate(980,307.76124924516563)">best constant for non-donors: ΔS = 99.3 J/(mol·K)</text><text y="0.32em" transform="translate(980,352.3888750092699)">O–H donors (median): ΔS = 114.7 J/(mol·K)</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="428.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Each dot is one liquid&#39;s vapour pressure near room temperature, placed by how far it is below its own boiling point. Clausius–Clapeyron with a constant heat of vaporisation says</text><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">they must all lie on one line through the origin whose slope is −ΔS/(R ln 10), and Trouton&#39;s rule says ΔS is about the same (≈ 10.5 R) for every liquid: so the boiling point alone fixes</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the whole vapour-pressure curve. Notice the red O–H donors sitting below the line: hydrogen bonds order the liquid, so leaving it gains more entropy, and at the same distance</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">below Tb they evaporate less. The best constant for room-temperature readings is above 10.5 R because ΔH_vap grows as T falls below Tb. Hover a dot; click it for the substance</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">on Wikidata.</text></svg>