95735,150)">4</text><text y="0.71em" transform="translate(769.2790030352131,150)">5</text><text y="0.71em" transform="translate(824.7058752685505,150)">6</text><text y="0.71em" transform="translate(871.5686280099796,150)">7</text><text y="0.71em" transform="translate(912.1629908943604,150)">8</text><text y="0.71em" transform="translate(947.9697566075274,150)"/><text y="0.71em" transform="translate(980,150)">10</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,150)">restarts (log; 0 drawn at ½) →</text></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Evicting fixes what a fresh pod fixes (a wedged process, a bad node); it doesn&#39;t fix a crash loop in the code or a missing image: read the pod&#39;s events first. Pending pods are</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">usually waiting for room (see the capacity example), not for an eviction.</text></svg>