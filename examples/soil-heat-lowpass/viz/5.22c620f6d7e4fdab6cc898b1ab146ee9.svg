ed: under 1% of the top layer&#39;s, where the layer averaging and the data&#39;s 0.1 °C rounding dominate; left out of the fit).</text><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Dashed: e^(−Δz/d), the heat equation&#39;s damping with the fitted damping depth d. A straight line on a log scale means each extra 10 cm takes the same fraction away. The daily</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">wave loses a factor e every ~10 cm, the yearly one every ~2–3 m: the heat equation says d = √(2κ/ω), so a cycle 365 times slower should reach √365 ≈ 19 times deeper. The lags</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">give 15, the amplitudes 33 (fit table): the right order, with thick layers and a κ that changes with the seasons in between. Hover a dot: the lag passes 90° at depth, which no single</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">first-order (RC) lag can do: the ground is a chain of infinitely many small RC stages.</text></svg>