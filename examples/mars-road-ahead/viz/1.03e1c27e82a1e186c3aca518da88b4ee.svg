<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="14.0" y="27.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="17px" font-weight="700">The road to Mars: 20 missions, and how sure they are</text><text x="14.0" y="55.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">2 on the way, 5 funded or partly funded, 11 proposed or uncertain, and 2 cancelled, as of 2026-11-18. On the timeline</text><text x="14.0" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">each launch is a pale range, from the earliest to the latest year the sources support; the dot is the current target,</text><text x="14.0" y="97.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">where there is one. Hover a mission for its status and why.</text><text x="14.0" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Look for:</text><text x="79.6" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">launches bunch up in the windows. Earth and Mars line up for a cheap transfer about every 26 months, so</text><text x="14.0" y="147.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">the end of 2028 is crowded, and a mission that misses a window waits two years. And the dates slip: the second chart</text><text x="14.0" y="168.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">shows how far.</text><text x="14.0" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Go further:</text><text x="91.3" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">who is at Mars today in</text><text x="250.6" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Missions at Mars now</text><text x="384.4" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">; every landing
so far in</text><text x="541.0" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Landing on Mars</text><text x="646.3" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">; upcoming launches</text><text x="14.0" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">of every kind in</text><text x="118.0" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Upcoming rocket launches</text><text x="282.3" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">.</text><text x="14.0" y="247.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Mind: a target date is a plan, not a forecast. &quot;Proposed&quot; (and statements by company founders) has no money behind</text><text x="14.0" y="268.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">it yet. The earliest-latest ranges are this board&#39;s reading of the sources, not agency figures; the table names each row&#39;s</text><text x="14.0" y="289.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">sources and what is uncertain.</text></svg>