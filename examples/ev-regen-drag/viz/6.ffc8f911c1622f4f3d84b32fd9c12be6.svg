02089,470)" d="M0,0L0,6"/><path transform="translate(605.4329321957183,470)" d="M0,0L0,6"/><path transform="translate(653.3906335121194,470)" d="M0,0L0,6"/><path transform="translate(694.9334839946865,470)" d="M0,0L0,6"/><path transform="translate(731.5768750616458,470)" d="M0,0L0,6"/><path transform="translate(764.3555053351047,470)" d="M0,0L0,6"/><path transform="translate(980,470)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(48,470)">10</text><text y="0.71em" transform="translate(263.6444946648955,470)">20</text><text y="0.71em" transform="translate(389.7884375308229,470)">30</text><text y="0.71em" transform="translate(479.28898932979115,470)">40</text><text y="0.71em" transform="translate(548.7110106702089,470)">50</text><text y="0.71em" transform="translate(605.4329321957183,470)">60</text><text y="0.71em" transform="translate(653.3906335121194,470)">70</text><text y="0.71em" transform="translate(694.9334839946865,470)">80</text><text y="0.71em" transform="translate(731.5768750616458,470)">90</text><text y="0.71em" transform="translate(764.3555053351047,470)">100</text><text y="0.71em" transform="translate(980,470)">200</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,470)">city cycle: energy per 100 km (kWh, log) →</text></g><g aria-label="line" fill="none" stroke="rgb(113, 113, 122)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(0.5,0.5)"><path d="M48,470L980,20" data-tip="0, 1"/></g><g aria-label="text" fill="rgb(113, 113, 122)" font-size="10px" transform="translate(0.5,-7.5)"><text y="0.32em" transform="translate(890.4994482010318,63.213785739845164) rotate(-45)">highway = city</text></g><g aria-label="dot" fill-opacity="0.55" transform="translate(0.5,0.5)"></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Petrol and diesel cars (red, brown) sit below the line: they use less per km on the highway. Battery EVs (blue) sit above it: the only cars for which the highway costs more. Hybrids</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">(amber) are in between. An engine is inefficient at the low loads of town driving, and every stop turns the car&#39;s kinetic energy into brake heat; an electric motor is efficient at any</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">load and recovers most of the braking energy, so what is left for an EV is rolling resistance and air drag, and drag per km grows with v². Click a dot for fueleconomy.gov.</text></svg>