ay GPS, radar and sonar find delays. 141 km in 21.25 h is</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">6.63 km/h (1.84 m/s), the speed of the pulse, not of the water. But a periodic signal correlates with itself every period: the next peak, at 44.75 h (dashed, r = 0.5924), is almost as</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">good, and a negative lag 24 h earlier would be too. What decides is causality (the lag can&#39;t be negative) and what isn&#39;t periodic: the day-to-day changes in the dam&#39;s schedule.</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Correlating the changes (blue) sharpens the peaks, a whitening step.</text></svg>