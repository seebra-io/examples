<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="14.0" y="27.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="17px" font-weight="700">Landing on Mars: 16 attempts, 10 that worked</text><text x="14.0" y="55.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Every spacecraft that tried to land on Mars, from the Soviet Mars 2 in 1971 to China&#39;s Zhurong in 2021, on NASA&#39;s map</text><text x="14.0" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">and on a timeline. Hover a site for what happened there. The positions are from each mission&#39;s Wikipedia article</text><text x="14.0" y="97.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">(linked in the table).</text><text x="14.0" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Look for:</text><text x="79.6" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">most landings are within 30° of the equator and in low plains and craters. Low ground means more air to</text><text x="14.0" y="147.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">slow down in, and near the equator the sun is strongest for solar panels. Phoenix went far north on purpose, to dig for</text><text x="14.0" y="168.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">ice.</text><text x="14.0" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Go further:</text><text x="91.3" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">the rovers to scale and what each one carries are in</text><text x="435.8" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Mars rovers up close</text><text x="563.2" y="197.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">; the newest photos from</text><text x="14.0" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Perseverance and Curiosity in</text><text x="211.9" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Mars rovers: the latest
raw images</text><text x="425.0" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">; NASA&#39;s 3D models in</text><text x="570.6" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Mars in 3D</text><text x="638.0" y="218.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">.</text><text x="14.0" y="247.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Mind: Mars 2&#39;s crash site is an estimate and Mars Polar Lander&#39;s is its target. Not counted: Mars 7&#39;s lander (missed the</text><text x="14.0" y="268.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">planet), the Deep Space 2 probes, and missions that never left Earth orbit. Coordinates are planetocentric, east</text><text x="14.0" y="289.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">longitudes.</text></svg>