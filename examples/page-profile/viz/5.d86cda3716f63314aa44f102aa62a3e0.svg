)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Purple: canvas moves (pan, zoom, drag). Amber and red: long animation frames (≥ 50 ms; red ≥ 200 ms), with the scripts that ran in them below. Blue: fetches from the page;</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">grey: every resource the browser loaded (click one to open it). Green: interactions; dashed lines: first paint, first contentful paint and LCP. Look for long frames and fetches that sit</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">under a purple bar: those are what made a pan stutter. The table refreshes with the timer; numbers depend on this machine, its other tabs and extensions.</text></svg>