0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Every resource the browser loaded in this session (Resource Timing), summed per origin and coloured by what asked for it (script, link, css, fetch, img...). Parallel loads overlap, so</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">a sum is work, not waiting. Cross-origin resources without a Timing-Allow-Origin header report 0 bytes and no first-byte time. The table &#39;slowest resources&#39; links to each one.</text></svg>