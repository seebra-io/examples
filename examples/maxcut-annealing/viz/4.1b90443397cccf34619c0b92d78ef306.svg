<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="14.0" y="27.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="17px" font-weight="700">Max-cut three ways: try them all, anneal, or ask a quantum annealer</text><text x="14.0" y="55.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">The problem:</text><text x="109.6" y="55.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">split the nodes of a graph into two groups so that as many links as possible run between the groups. It</text><text x="14.0" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">sounds simple, but no known method solves every case fast: the work grows exponentially with the size. It stands for</text><text x="14.0" y="97.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">many real problems (splitting a circuit across two chips, assigning two frequencies so that neighbours differ, finding two</text><text x="14.0" y="118.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">camps in a network).</text><text x="14.0" y="147.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Here, on 20 nodes, 3 neighbours each (20 nodes, 30 links):</text><text x="417.0" y="147.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">1. Try them all.</text><text x="523.6" y="147.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">524,288 splits, exact, and still quick at this</text><text x="14.0" y="168.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">size.</text><text x="46.2" y="168.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">2. Simulated annealing.</text><text x="214.1" y="168.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Start anywhere, move one node at a time, accept worse moves less and less often as the</text><text x="14.0" y="189.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">&quot;temperature&quot; falls. Fast, but it can get stuck: the study asks whether a slower schedule helps.</text><text x="632.1" y="189.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">3. A quantum annealer.</text><text x="14.0" y="206.5" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">D-Wave&#39;s</text><text x="62.5" y="210.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">QPU finds low-energy states of an Ising model, E = Σ J</text><text x="412.2" y="214.3" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11.6667px">ij</text><text x="418.2" y="210.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">s</text><text x="428.6" y="214.3" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11.6667px">i</text><text x="431.6" y="210.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">s</text><text x="441.9" y="214.3" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11.6667px">j</text><text x="448.6" y="210.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">with spins s = ±1. Set J = +1 on every link and E = (links</text><text x="14.0" y="235.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">uncut − links cut), so the lowest energy</text><text x="272.4" y="235.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">is</text><text x="285.7" y="235.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">the maximum cut. The machine anneals too, but with quantum fluctuations</text><text x="14.0" y="256.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">instead of heat.</text><text x="14.0" y="285.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Look for:</text><text x="79.6" y="285.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">how rare the best cut is among all splits (the landscape), and how the share of annealing runs that find it rises</text><text x="14.0" y="306.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">with the schedule.</text><text x="14.0" y="335.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Change it:</text><text x="84.9" y="335.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">pick another graph in the</text><text x="258.6" y="335.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Graph</text><text x="301.2" y="335.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">step (the Petersen graph, 22 random nodes, or a grid, where the best split</text><text x="14.0" y="356.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">must cut every link).</text><text x="149.3" y="356.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Next:</text><text x="186.9" y="356.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">a board that sends this same graph to D-Wave&#39;s QPU with your own Leap token.</text><text x="14.0" y="385.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Mind: at this size a laptop is exact, so nothing here needs a quantum computer; the point is to see the landscape and the</text><text x="14.0" y="406.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">method. Whether quantum annealing beats the best classical methods on large problems is an open research question,</text><text x="14.0" y="427.0" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">not a settled fact.</text></svg>