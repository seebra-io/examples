<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><text x="14.0" y="27.4" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="17px" font-weight="700">Your own data, out of the platforms and into view</text><text x="14.0" y="55.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Under the GDPR every platform must give you a copy of your data (Article 15) in a machine-readable form (Article</text><text x="14.0" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">20). The</text><text x="69.6" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">guide</text><text x="112.7" y="76.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">says where to ask, which file in the export matters and what to look at. The two worked examples</text><text x="14.0" y="97.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">run on</text><text x="61.5" y="97.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">made-up sample files</text><text x="210.5" y="97.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">shaped exactly like the real ones:</text><text x="32.0" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Spotify</text><text x="81.0" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">:</text><text x="88.4" y="129.7" fill="rgb(244, 244, 245)" font-family="monospace" font-size="14px">Streaming_History_Audio_*.json</text><text x="340.4" y="126.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">→ listening clock, artists by month, skips</text><text x="32.0" y="152.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">Netflix</text><text x="79.8" y="152.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">:</text><text x="87.2" y="155.7" fill="rgb(244, 244, 245)" font-family="monospace" font-size="14px">NetflixViewingHistory.csv</text><text x="288.8" y="152.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">→ a viewing calendar and binges</text><text x="14.0" y="186.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-weight="700">To use your own:</text><text x="130.9" y="186.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">drop the file on the board, then point the transformation
(</text><text x="515.2" y="186.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Plays</text><text x="547.3" y="186.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">or</text><text x="568.9" y="186.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px" font-style="italic">Titles</text><text x="600.8" y="186.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">) at it instead of the</text><text x="14.0" y="207.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">sample. Your file stays in your browser unless you save the dashboard.</text><text x="14.0" y="236.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">Mind: exports are a snapshot; times may be UTC; other people appear in your data (messages, shared playlists), so</text><text x="14.0" y="257.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="14px">keep what is theirs private.</text></svg>