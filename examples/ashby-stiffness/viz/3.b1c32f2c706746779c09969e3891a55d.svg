L439,375.162L764,356.617" data-tip="8, 26, 44"/><path stroke="rgb(108, 197, 176)" stroke-opacity="0.4" stroke-width="1" d="M114,20L439,214.732L764,279.614" data-tip="9, 27, 45"/><path stroke="rgb(239, 177, 24)" stroke-opacity="0.4" stroke-width="1" d="M114,254.914L439,259.665L764,261.215" data-tip="10, 28, 46"/><path stroke="rgb(255, 114, 92)" stroke-opacity="0.4" stroke-width="1" d="M114,235.876L439,327.216L764,357.674" data-tip="11, 29, 47"/><path stroke="rgb(239, 177, 24)" stroke-opacity="0.95" stroke-width="2.5px" d="M114,279.443L439,322.592L764,336.926" data-tip="12, 30, 48"/><path stroke="rgb(108, 197, 176)" stroke-opacity="0.4" stroke-width="1" d="M114,86.522L439,240.356L764,291.624" data-tip="13, 31, 49"/><path stroke="rgb(66, 105, 208)" stroke-opacity="0.95" stroke-width="2.5px" d="M114,264.631L439,264.631L764,264.631" data-tip="14, 32, 50"/><path stroke="rgb(66, 105, 208)" stroke-opacity="0.95" stroke-width="2.5px" d="M114,259.537L439,279.956L764,286.717" data-tip="15, 33, 51"/><path stroke="rgb(239, 177, 24)" stroke-opacity="0.4" stroke-width="1" d="M114,256.299L439,278.26L764,285.589" data-tip="16, 34, 52"/><path stroke="rgb(255, 114, 92)" stroke-opacity="0.95" stroke-width="2.5px" d="M114,249.087L439,356.88L764,393.111" data-tip="17, 35, 53"/></g><g aria-label="dot" transform="translate(0.5,0.5)"></g><g aria-label="text" text-anchor="start" font-size="10px" transform="translate(8.5,0.5)"><text y="0.32em" transform="translate(764,339.12512386497184)" fill="rgb(60, 169, 81)">AKROLOY PARA ICF 40</text><text y="0.32em" transform="translate(764,258.83913995251936)" fill="rgb(66, 105, 208)">Alloy 718</text><text y="0.32em" transform="translate(764,312.509363523962)" fill="rgb(66, 105, 208)">Aluminium 6061 T6 temper</text><text y="0.32em" transform="translate(764,299.25662829677117)" fill="rgb(60, 169, 81)">Grivory GM-4H</text><text y="0.32em" transform="translate(764,325.19620539470765)" fill="rgb(255, 138, 183)">aluminium oxide</text><text y="0.32em" transform="translate(764,371.48452326380544)" fill="rgb(239, 177, 24)">beryllium</text><text y="0.32em" transform="translate(764,392.22489092581)" fill="rgb(255, 114, 92)">black spruce wood</text><text y="0.32em" transform="translate(764,359.2896194768577)" fill="rgb(239, 177, 24)">boron</text><text y="0.32em" transform="translate(764,356.61705537665415)" fill="rgb(255, 138, 183)">diamond</text><text y="0.32em" transform="translate(764,279.61350454702324)" fill="rgb(108, 197, 176)">high-density polyethylene</text><text y="0.32em" transform="translate(764,261.21527273788183)" fill="rgb(239, 177, 24)">iron</text><text y="0.32em" transform="translate(764,357.6736336106152)" fill="rgb(255, 114, 92)">jarrah</text><text y="0.32em" transform="translate(764,336.92569706883245)" fill="rgb(239, 177, 24)">magnesium</text><text y="0.32em" transform="translate(764,291.62405552739835)" fill="rgb(108, 197, 176)">poly(methyl methacrylate)</text><text y="0.32em" transform="translate(764,264.6313721113075)" fill="rgb(66, 105, 208)">steel</text><text y="0.32em" transform="translate(764,286.71652323862264)" fill="rgb(66, 105, 208)">titanium</text><text y="0.32em" transform="translate(764,285.58911793786586)" fill="rgb(239, 177, 24)">titanium (from K, G)</text><text y="0.32em" transform="translate(764,393.111048131828)" fill="rgb(255, 114, 92)">white spruce wood</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="428.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Mass of a part of the same stiffness and shape family, relative to steel (dashed line = steel). Notice the lines fan out from left to right: for a tie (mass ∝ ρ/E) aluminium and</text><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">titanium weigh about what steel does, but a panel&#39;s mass goes as ρ/E^⅓, so a low density pays off nearly in full while low stiffness is forgiven: aluminium panels weigh about half</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">of steel ones, spruce a sixth. That is why airframe skins are aluminium or carbon-fibre composite and early aircraft and gliders were spruce. Hover a dot for the index and the</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">material&#39;s E and ρ; click for Wikidata. Caveat: stiffness only (strength, fatigue, cost and how the part is joined are ignored); wood and fibre composites are stiff only along the</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">grain or fibres.</text></svg>