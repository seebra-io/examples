)">100</text><text y="0.71em" transform="translate(504.82549756792156,430)">200</text><text y="0.71em" transform="translate(690.6173581989214,430)">300</text><text y="0.71em" transform="translate(822.4387811578115,430)">400</text><text y="0.71em" transform="translate(924.6874204548242,430)">500</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">Young&#39;s modulus recorded on Wikidata, P5480 (GPa) →</text></g><g aria-label="line" fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(0.5,0.5)"><path d="M48,430L980,20" data-tip="0, 1"/></g><g aria-label="rule" stroke="rgb(249, 115, 22)" stroke-width="2px" transform="translate(0,0.5)"><line x1="732.8996530147522" x2="734.2903038823187" y1="143.50948849730304" y2="143.50948849730304"/><line x1="255.2210965041957" x2="255.2210965041957" y1="348.26752912155587" y2="348.26752912155587"/><line x1="650.747082548332" x2="650.747082548332" y1="101.73247087844413" y2="101.73247087844413"/></g><g aria-label="dot" fill="rgb(249, 115, 22)" transform="translate(0.5,0.5)"></g><g aria-label="text" text-anchor="start" font-size="11" transform="translate(8.5,0.5)"><text y="0.32em" transform="translate(733.595506009765,143.50948849730304)">molybdenum (×0.928)</text><text y="0.32em" transform="translate(255.2210965041957,348.26752912155587)">titanium (×0.954)</text><text y="0.32em" transform="translate(650.747082548332,101.73247087844413)">rhodium (×1.367)</text></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">A check of the two lists against each other on the few materials in both (orange bars: the range of recorded E values). On the dashed line the two agree. Isotropic elasticity ties</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the moduli together (E = 9KG/(3K+G)), so the gap is in the inputs: Wikidata&#39;s K and G carry no reference and look like DFT values (identical numbers for all silica polymorphs, G &gt; K</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">for silica), which typically differ from handbook values by 10–30%. Read the triangles on the Ashby chart with that error bar in mind.</text></svg>