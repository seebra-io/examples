ll="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Grey: each measurement, as the percentage more (+) or less (−) water than the single all-years curve says at its stage. Orange: the decade&#39;s median and middle half. At low flows</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the residuals climb steadily from the 1950s to the 2020s: a curve fitted to all years would under-report today&#39;s low flows badly. Floods stay near zero. A rating is a model with a</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">shelf life. Caveat: residuals also hold measurement error (rated Poor ±8% or worse, Good ±5%) and hysteresis (a rising flood carries more than a falling one at the same stage).</text></svg>