">2020s</text></g><g aria-label="x-axis label" transform="translate(0.5,27.5)"><text transform="translate(514,430)">decade →</text></g><g aria-label="line" fill="none" stroke-width="2px" stroke-linejoin="round" stroke-linecap="round" transform="translate(0.5,0.5)"><path stroke="rgb(255, 114, 92)" d="M96,390.452L189,384.444L282,371.429L375,368.926L468,390.786L561,392.788L654,401.966L747,413.48L840,418.319L933,430"/><path stroke="rgb(66, 105, 208)" d="M96,276.479L189,269.638L282,257.623L375,248.612L468,254.453L561,256.622L654,264.632L747,270.639L840,277.481L933,284.322"/><path stroke="rgb(239, 177, 24)" d="M96,69.727L189,62.886L282,61.551L375,31.013L468,20L561,22.837L654,36.687L747,28.677L840,29.011L933,39.858"/></g><g aria-label="dot" transform="translate(0.5,0.5)"><circle cx="96" cy="390.45177045177047" r="4" fill="rgb(255, 114, 92)"/><circle cx="96" cy="276.4794464794465" r="4" fill="rgb(66, 105, 208)"/><circle cx="96" cy="69.72730972730967" r="4" fill="rgb(239, 177, 24)"/><circle cx="189" cy="384.44444444444446" r="4" fill="rgb(255, 114, 92)"/><circle cx="189" cy="269.6377696377697" r="4" fill="rgb(66, 105, 208)"/><circle cx="189" cy="62.88563288563289" r="4" fill="rgb(239, 177, 24)"/><circle cx="282" cy="371.42857142857144" r="4" fill="rgb(255, 114, 92)"/><circle cx="282" cy="257.6231176231176" r="4" fill="rgb(66, 105, 208)"/><circle cx="282" cy="61.55067155067159" r="4" fill="rgb(239, 177, 24)"/><circle cx="375" cy="368.92551892551893" r="4" fill="rgb(255, 114, 92)"/><circle cx="375" cy="248.61212861212863" r="4" fill="rgb(66, 105, 208)"/><circle cx="375" cy="31.013431013431067" r="4" fill="rgb(239, 177, 24)"/><circle cx="468" cy="390.78551078551084" r="4" fill="rgb(255, 114, 92)"/><circle cx="468" cy="254.45258445258446" r="4" fill="rgb(66, 105, 208)"/><circle cx="468" cy="20" r="4" fill="rgb(239, 177, 24)"/><circle cx="561" cy="392.7879527879528" r="4" fill="rgb(255, 114, 92)"/><circle cx="561" cy="256.6218966218966" r="4" fill="rgb(66, 105, 208)"/><circle cx="561" cy="22.836792836792885" r="4" fill="rgb(239, 177, 24)"/><circle cx="654" cy="401.96581196581195" r="4" fill="rgb(255, 114, 92)"/><circle cx="654" cy="264.63166463166465" r="4" fill="rgb(66, 105, 208)"/><circle cx="654" cy="36.68701668701671" r="4" fill="rgb(239, 177, 24)"/><circle cx="747" cy="413.4798534798535" r="4" fill="rgb(255, 114, 92)"/><circle cx="747" cy="270.6389906389906" r="4" fill="rgb(66, 105, 208)"/><circle cx="747" cy="28.677248677248723" r="4" fill="rgb(239, 177, 24)"/><circle cx="840" cy="418.31908831908834" r="4" fill="rgb(255, 114, 92)"/><circle cx="840" cy="277.48066748066753" r="4" fill="rgb(66, 105, 208)"/><circle cx="840" cy="29.01098901098898" r="4" fill="rgb(239, 177, 24)"/><circle cx="933" cy="430" r="4" fill="rgb(255, 114, 92)"/><circle cx="933" cy="284.3223443223443" r="4" fill="rgb(66, 105, 208)"/><circle cx="933" cy="39.8575498575498" r="4" fill="rgb(239, 177, 24)"/></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Each decade&#39;s measurements get their own curve; read off it the stage that carries the same flow. 40,000 ft³/s ran at 7.08 ft in the 1960s and at 3.42 ft in the 2020s: the river bed</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">at Hermann has cut down (sand dredging, and dams upstream that trap sediment), so the same water stands lower. The flood curve moves far less: at high water the wide</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">channel and floodplain, not the bed, set the stage. That is why USGS keeps measuring (about 8 times a year here) and applies shifts to the rating between measurements. Caveat:</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">each decade&#39;s e and b trade off against each other; the stage at a fixed flow is the robust comparison.</text></svg>