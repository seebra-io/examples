same stage holds more water in recent (yellow) years than in the 1950s (purple), because the bed has moved: one curve for all years can&#39;t</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">be right. Hover a dot for its date, rating and how far it is from the curve; click for the gage&#39;s page.</text></svg>