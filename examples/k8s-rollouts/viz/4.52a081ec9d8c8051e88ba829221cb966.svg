<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg width="15.0" height="15.0" fill="rgb(56, 189, 248)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="0.0" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="20.0" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">most common version</text><svg width="15.0" height="15.0" fill="rgb(249, 115, 22)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="135.2" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="155.2" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">other version</text><svg width="15.0" height="15.0" fill="rgb(239, 68, 68)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="227.9" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="247.9" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">mutable tag</text><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="428.0" viewBox="0 0 1000 180" stroke="none" font-weight="400" x="0.0" y="38.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="x-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0.5,0)"><line x1="630" x2="630" y1="20" y2="150"/></g><g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><path transform="translate(630,150)" d="M0,0L0,6"/></g><g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)"><text y="0.71em" transform="translate(630,150)">0</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,150)">uses (containers in deployment templates) →</text></g><g aria-label="rule" stroke="rgb(244, 244, 245)" transform="translate(0.5,0)"><line x1="630" x2="630" y1="20" y2="150"/></g></svg><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Diversity (1 − Σp²) is the chance that two uses of an image picked at random run different versions. A sidecar or base image with several versions is usually a rollout that didn&#39;t</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">reach every team. Image repositories used once with one version are left out.</text></svg>