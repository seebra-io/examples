<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg width="15.0" height="15.0" fill="rgb(161, 161, 170)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="0.0" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="20.0" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">body-wave mb (and others)</text><svg width="15.0" height="15.0" fill="rgb(56, 189, 248)" stroke="none" font-family="system-ui, sans-serif" font-size="10px" font-weight="400" x="158.5" y="9.0" viewBox="0 0 15 15" overflow="visible" color="rgb(244, 244, 245)"><rect width="100%" height="100%"/></svg><text x="178.5" y="20.7" fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="10px">moment magnitude Mw</text><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="1000.0" height="411.0" viewBox="0 0 1000 460" stroke="none" font-weight="400" x="0.0" y="38.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="y-grid" aria-hidden="true" stroke="rgb(244, 244, 245)" stroke-opacity="0.1" transform="translate(0,0.5)"><line x1="48" x2="980" y1="430" y2="430"/><line x1="48" x2="980" y1="395.83333333333337" y2="395.83333333333337"/><line x1="48" x2="980" y1="361.66666666666663" y2="361.66666666666663"/><line x1="48" x2="980" y1="327.5" y2="327.5"/><line x1="48" x2="980" y1="293.33333333333337" y2="293.33333333333337"/><line x1="48" x2="980" y1="259.1666666666667" y2="259.1666666666667"/><line x1="48" x2="980" y1="224.99999999999994" y2="224.99999999999994"/><line x1="48" x2="980" y1="190.83333333333331" y2="190.83333333333331"/><line x1="48" x2="980" y1="156.66666666666666" y2="156.66666666666666"/><line x1="48" x2="980" y1="122.49999999999996" y2="122.49999999999996"/><line x1="48" x2="980" y1="88.33333333333333" y2="88.33333333333333"/><line x1="48" x2="980" y1="54.166666666666636" y2="54.166666666666636"/><line x1="48" x2="980" y1="20" y2="20"/></g><g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="rgb(244, 244, 245)" transform="translate(0,0.5)"><path transform="translate(48,430)" d="M0,0L-6,0"/><path transform="translate(48,395.83333333333337)" d="M0,0L-6,0"/><path transform="translate(48,361.66666666666663)" d="M0,0L-6,0"/><path transform="translate(48,327.5)" d="M0,0L-6,0"/><path transform="translate(48,293.33333333333337)" d="M0,0L-6,0"/><path transform="translate(48,259.1666666666667)" d="M0,0L-6,0"/><path transform="translate(48,224.99999999999994)" d="M0,0L-6,0"/><path transform="translate(48,190.83333333333331)" d="M0,0L-6,0"/><path transform="translate(48,156.66666666666666)" d="M0,0L-6,0"/><path transform="translate(48,122.49999999999996)" d="M0,0L-6,0"/><path transform="translate(48,88.33333333333333)" d="M0,0L-6,0"/><path transform="translate(48,54.166666666666636)" d="M0,0L-6,0"/><path transform="translate(48,20)" d="M0,0L-6,0"/></g><g aria-label="y-axis tick label" text-anchor="end" font-variant="tabular-nums" transform="translate(-8.5,0.5)"><text y="0.32em" transform="translate(48,430)">0.4</text><text y="0.32em" transform="translate(48,395.83333333333337)">0.6</text><text y="0.32em" transform="translate(48,361.66666666666663)">0.8</text><text y="0.32em" transform="translate(48,327.5)">1.0</text><text y="0.32em" transform="translate(48,293.33333333333337)">1.2</text><text y="0.32em" transform="translate(48,259.1666666666667)">1.4</text><text y="0.32em" transform="translate(48,224.99999999999994)">1.6</text><text y="0.32em" transform="translate(48,190.83333333333331)">1.8</text><text y="0.32em" transform="translate(48,156.66666666666666)">2.0</text><text y="0.32em" transform="translate(48,122.49999999999996)">2.2</text><text y="0.32em" transform="translate(48,88.33333333333333)">2.4</text><text y="0.32em" transform="translate(48,54.166666666666636)">2.6</text><text y="0.32em" transform="translate(48,20)">2.8</text></g><g aria-label="y-axis label" text-anchor="start" transform="translate(-44.5,-16.5)"><text y="0.71em" transform="translate(48,20)">↑ b-value (Aki–Utsu), 95% interval</text></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">cut-off magnitude Mc →</text></g><g aria-label="rule" stroke="rgb(249, 115, 22)" stroke-dasharray="4px, 3px" transform="translate(0,0.5)"><line x1="48" x2="980" y1="327.5" y2="327.5"/></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Where does b settle? USGS reports most small quakes in body-wave magnitude mb and most large ones in moment magnitude Mw (mb saturates near 6), so the mb family lacks</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">its large quakes (b far above 1) and the Mw family lacks many of its small ones (b too low at small Mc). Read the Mw dots past Mc ≈ 5.5: with the scale that measures the fault&#39;s</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">real size, b is close to 1 (orange). Hidden lesson: a b-value is a property of a catalogue and its magnitude scale as much as of the Earth.</text></svg>