<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px" color="rgb(244, 244, 245)" data-seebra-visual="1"><rect x="0" y="0" width="1000" height="500" fill="#09090b"/><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="490.0" height="170.0" viewBox="0 0 490 170" stroke="none" font-weight="400" x="0.0" y="0.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(470,140)">distinct: 1 − mean similarity to the 5 nearest →</text></g></svg><svg fill="rgb(244, 244, 245)" font-family="system-ui, sans-serif" font-size="11px" text-anchor="middle" width="490.0" height="170.0" viewBox="0 0 490 170" stroke="none" font-weight="400" x="510.0" y="0.0" overflow="visible" color="rgb(244, 244, 245)"><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(470,140)">place-name effect: distinct with places kept − removed →</text></g></svg><text x="0.0" y="187.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Energy and market APIs (any category with &#39;energy&#39; or &#39;markets&#39; in its path) are a little less distinct than the rest, and they are the group where removing place names makes</text><text x="0.0" y="204.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">neighbours look more alike (the per-country grid operators: Fingrid, Statnett, Elering, Energinet). Both effects are small next to the vendor families and to rarity: read with the</text><text x="0.0" y="221.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">table and the field chart.</text></svg>