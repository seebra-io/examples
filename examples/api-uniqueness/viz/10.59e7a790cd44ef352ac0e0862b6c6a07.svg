ansform="translate(171.85714285714283,430)">60</text><text y="0.71em" transform="translate(254.42857142857144,430)">80</text><text y="0.71em" transform="translate(337,430)">100</text></g><g font-variant="tabular-nums" transform="translate(643,0)"><text y="0.71em" transform="translate(89.28571428571428,430)">40</text><text y="0.71em" transform="translate(171.85714285714283,430)">60</text><text y="0.71em" transform="translate(254.42857142857144,430)">80</text><text y="0.71em" transform="translate(337,430)">100</text></g></g><g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)"><text transform="translate(980,430)">v1 score (k = 5, place names removed) →</text></g><g aria-label="line" transform="translate(0.5,0.5)"><g fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(1,0)"><path d="M48,430L337,24" data-tip="0, 1"/></g><g fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(322,0)"><path d="M48,430L337,24" data-tip="0, 1"/></g><g fill="none" stroke="rgb(244, 244, 245)" stroke-width="1.5px" stroke-opacity="0.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4px, 3px" transform="translate(643,0)"><path d="M48,430L337,24" data-tip="0, 1"/></g></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">On the dashed line the variant agrees with v1. A larger k averages over farther neighbours, so every score rises (and a pair of twins weighs less); k = 3 punishes having one twin.</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Keeping place names barely moves anything: the near-copies in this catalog are rarely the same thing for another country. The table gives the rank correlations and how many of</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">the top and bottom 50 stay there.</text></svg>