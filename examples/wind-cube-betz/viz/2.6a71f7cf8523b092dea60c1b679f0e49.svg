font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">third of the free speed downstream, which captures 16/27 of the power. This farm peaks around 7–9 m/s (wake losses between turbines, electrical losses and the grid-cell wind</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">included), then Cp falls as 1/v³ once output is capped at rated power.</text></svg>