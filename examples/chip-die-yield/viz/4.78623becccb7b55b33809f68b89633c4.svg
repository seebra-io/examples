e="rgb(34, 197, 94)" d="M48,24L49.196,24L51.587,24L53.978,24L56.369,24L58.76,24L61.151,24L65.933,24L70.715,181.732L76.693,181.732L82.67,181.732L88.648,181.732L94.626,270.281L106.581,270.281L118.536,323.778L130.492,323.778L142.447,357.984L154.402,357.984L166.358,380.867L178.313,380.867L190.268,396.75L202.223,396.75L214.179,408.117L226.134,408.117L238.089,416.466L251.958,416.466L262,422.736"/></g></g><g aria-label="dot" transform="translate(0.5,0.5)"><g transform="translate(2,0)"></g><g transform="translate(240,0)"></g><g transform="translate(478,0)"></g><g transform="translate(716,0)"></g></g><g aria-label="tip" transform="translate(0.5,0.5)"><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(2,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(240,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(478,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(716,0)"/></g></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Each panel is one defect density (a scenario: about 0.1/cm² for a mature process, 0.5 for a young one). Dots: real dies from Wikidata on the Poisson curve; click one for its article.</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Notice the yield falls exponentially with area: at 0.5 defects/cm² a phone SoC of 90 mm² still yields about 64%, a 430 mm² laptop chip about 12%. Clustered defects (Murphy,</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">negative binomial) are kinder to big dies, but the shape is the same.</text></svg>