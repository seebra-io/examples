3.354,403.23L128.465,400.867L128.838,400.69L129.935,400.128L131.032,399.669L131.032,399.669L131.032,399.669L138.052,396.357L138.392,396.232L142.001,394.538L144.194,393.546L146.388,392.479L146.388,392.479L146.388,392.479L159.55,386.339L163.938,384.355L166.351,383.248L167.228,382.765L169.422,381.697L190.153,372.175L203.425,366.054L211.037,362.599L214.393,361.189L214.393,361.189L227.556,355.162L229.749,354.197L229.749,354.197L260.461,340.042L262.655,339.049L262.655,339.049L279.108,331.538L292.27,325.484L295.561,324.161L301.045,321.517L314.207,315.742L321.885,312.168L338.338,304.859L346.016,301.269L396.801,278.72L398.665,277.878L398.665,277.878L398.665,277.878L411.828,271.815L414.021,270.87L434.423,261.956L438.723,259.948L443.637,257.794L506.157,229.547L601.584,186.677L980,20"/></g><g aria-label="dot" transform="translate(0.5,0.5)"></g><g aria-label="tip" fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0.5,0.5)"/></svg><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">The price of a wafer is fixed, so a good mm² of a big die costs more: fewer dies fit (edge loss) and fewer of them work. Small dies sit near 1 at every defect density; an 860 mm²</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">full-frame sensor costs several times the ideal at 0.1/cm² and far more on a young process. That is why big dies arrive late on a new node, why GPUs and sensors carry spare</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">units, and why chiplets exist.</text></svg>