family="ui-sans-serif, system-ui, sans-serif" font-size="12px">and hardly at all for small dies on a mature one (the 10% overhead can make it a loss). Caveats: packaging, test and interconnect costs and their own yield are left out; real chiplet</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">designs also mix nodes (cheap I/O dies on older processes).</text></svg>