ranslate(0,0)"><path d="M60,40.355L162,72.574L264,85.781L366,93.004L468,97.57L570,100.743L672,103.038L774,104.793L876,106.186"/></g><g fill="none" stroke="rgb(249, 115, 22)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,104)"><path d="M60,40.355L162,72.574L264,85.781L366,93.004L468,97.57L570,100.743L672,103.038L774,104.793L876,106.186"/></g><g fill="none" stroke="rgb(249, 115, 22)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,208)"><path d="M60,40.355L162,72.574L264,85.781L366,93.004L468,97.57L570,100.743L672,103.038L774,104.793L876,106.186"/></g><g fill="none" stroke="rgb(249, 115, 22)" stroke-width="1.5px" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,312)"><path d="M60,40.355L162,72.574L264,85.781L366,93.004L468,97.57L570,100.743L672,103.038L774,104.793L876,106.186"/></g></g><g aria-label="rule" transform="translate(0,0.5)"><g stroke="rgb(244, 244, 245)" transform="translate(0,0)"><line x1="48" x2="980" y1="118" y2="118"/></g><g stroke="rgb(244, 244, 245)" transform="translate(0,104)"><line x1="48" x2="980" y1="118" y2="118"/></g><g stroke="rgb(244, 244, 245)" transform="translate(0,208)"><line x1="48" x2="980" y1="118" y2="118"/></g><g stroke="rgb(244, 244, 245)" transform="translate(0,312)"><line x1="48" x2="980" y1="118" y2="118"/></g></g><g aria-label="tip" transform="translate(46.5,0.5)"><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0,0)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0,104)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0,208)"/><g fill="rgb(9, 9, 11)" stroke="rgb(244, 244, 245)" pointer-events="none" text-anchor="start" transform="translate(0,312)"/></g></svg><text x="0.0" y="445.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">Grey bars: observed shares; orange: Benford&#39;s log10(1 + 1/d), with the 95% band for this many countries. Notice that 1 leads about 30% of the time and 9 under 5%: quantities</text><text x="0.0" y="462.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">that grow multiplicatively and span several orders of magnitude are spread evenly on a log scale. Caveat: ~215 countries per quantity is a small sample, so χ² can&#39;t see small</text><text x="0.0" y="479.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">departures (and with millions of values it flags trivial ones); MAD (mean absolute deviation of the shares, Nigrini&#39;s measure) is a size of the departure, but at this n chance alone</text><text x="0.0" y="496.6" fill="rgb(244, 244, 245)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12px">gives about 0.016, so Nigrini&#39;s thresholds (set for thousands of values) don&#39;t apply. Conformity is not proof of honest data.</text></svg>